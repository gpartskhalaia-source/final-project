<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Registration | TrailNest</title>
    <meta
      name="description"
      content="Join TrailNest and start exploring exciting travel destinations and adventures."
    />
    <meta name="author" content="Gvantsa Partskhalaia" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TrailNest" />
    <meta property="og:title" content="Registration | TrailNest" />
    <meta
      property="og:description"
      content="Join TrailNest and start exploring exciting travel destinations and adventures."
    />
    <meta
      property="og:image"
      content="https://gpartskhalaia-source.github.io/final-project/images/hero.webp"
    />
    <meta
      property="og:url"
      content="https://gpartskhalaia-source.github.io/final-project/registration.html"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts and CSS -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/registration.css" />
  </head>

  <body>
    <header class="registration-header">
      <a href="./index.html">
        <img
          class="registration-logo"
          src="./images/trailnest-header-logo.svg"
          alt="TrailNest home"
        />
      </a>

      <button
        class="menu-btn"
        id="menuBtn"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="navigation"
      >
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>

      <nav
        class="registration-nav nav-page"
        id="navigation"
        aria-label="Main navigation"
      >
        <ul>
          <li><a href="./index.html">HOME</a></li>
          <li><a href="./destinations.html">DESTINATIONS</a></li>
          <li><a href="./aboutus.html">ABOUT US</a></li>
          <li><a href="./contacts.html">CONTACTS</a></li>
        </ul>
      </nav>

      <a class="plan-btn" href="./registration.html" aria-current="page">
        Registration
      </a>
    </header>

    <main class="registration">
      <h1>Join TrailNest</h1>
      <p class="description">Your next adventure starts here.</p>

      <form id="registration" novalidate>
        <!-- USERNAME -->
        <div class="form-group">
          <label for="username">Username</label>

          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            aria-describedby="error-username"
            required
          />

          <p class="errorText" id="error-username"></p>
        </div>

        <!-- EMAIL -->
        <div class="form-group">
          <label for="email">Email address</label>

          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            aria-describedby="error-email"
            required
          />

          <p class="errorText" id="error-email"></p>
        </div>

        <!-- PASSWORD -->
        <div class="form-group">
          <label for="password">Password</label>

          <div class="password-field">
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="new-password"
              aria-describedby="error-password"
              required
            />

            <button
              type="button"
              id="togglePassword"
              class="password-toggle"
              aria-label="Show password"
              aria-pressed="false"
              aria-controls="password"
            >
              <i class="fa-solid fa-eye" id="toggleIcon" aria-hidden="true"></i>
            </button>
          </div>

          <p class="errorText" id="error-password"></p>
        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="form-group">
          <label for="password2">Confirm password</label>

          <input
            type="password"
            id="password2"
            name="password2"
            autocomplete="new-password"
            aria-describedby="error-password2"
            required
          />

          <p class="errorText" id="error-password2"></p>
        </div>

        <!-- AGREEMENT -->
        <div class="agree-group">
          <label for="checkagree">
            <input
              type="checkbox"
              id="checkagree"
              name="agree"
              aria-describedby="error-agree"
              required
            />
            I agree to continue with registration.
          </label>

          <p class="errorText" id="error-agree"></p>
        </div>

        <!-- SUBMIT -->
        <button class="register-btn" type="submit">Register</button>

        <p id="form-message" role="status"></p>
      </form>
    </main>

    <footer class="registration-footer">
      <p>&copy; 2026 TrailNest. All rights reserved.</p>
    </footer>

    <!-- JAVASCRIPT -->
    <script src="./js/burger.js"></script>
    <script src="./js/registration.js"></script>
  </body>
</html>
