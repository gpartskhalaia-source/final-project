<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Travel Web Page" />
    <meta name="keywords" content="HTML, CSS, JavaScript" />
    <meta name="author" content="Gvantsa Partskhalaia" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Your Trip | TrailNest</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Book Your Adventure | TrailNest" />
    <meta
      property="og:description"
      content="Choose your favorite tours, select the number of travelers, and calculate your adventure price."
    />
    <meta
      property="og:image"
      content="https://gpartskhalaia-source.github.io/final-project/images/hero.webp"
    />
    <meta
      property="og:url"
      content="https://gpartskhalaia-source.github.io/final-project/booking.html"
    />

    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/booking.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="booking-header">
      <a href="./index.html">
        <img src="./images/trailnest-header-logo.svg" alt="TrailNest home" />
      </a>
      <a href="./destinations.html">Back to Destinations</a>
    </header>

    <main class="booking-container">
      <h1>Book Your Adventure</h1>
      <p>Choose your tours and calculate the total price.</p>

      <h2>Available Tours</h2>
      <div id="tours"></div>

      <h2>Your Bookings</h2>
      <div id="bookings"></div>

      <div class="total-box">
        <h2>Total Price</h2>
        <p id="total-price">$0</p>
      </div>
    </main>

    <footer class="booking-footer">
      <p>© 2026 TrailNest. All rights reserved.</p>
    </footer>

    <script src="./js/booking.js"></script>
  </body>
</html>
